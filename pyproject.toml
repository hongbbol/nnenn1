[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nnenn1"
version = "0.1.0"
description = "Global cat food nutrition data collection — OPFF baseline import"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "hongbbol" }]
license = { text = "TBD" }
dependencies = [
  "supabase>=2,<3",
  "ijson>=3.2,<4",
  "pyyaml>=6.0,<7",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "tenacity>=8.2,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5",
]

[tool.setuptools]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
